services:
  - type: web
    name: sistema-prestamos-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npx prisma generate --config prisma7.config.ts && npm run build
    preDeployCommand: npx prisma migrate deploy --config prisma7.config.ts
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-prestamos-db
          property: connectionString
      - key: SHADOW_DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false

  - type: static
    name: sistema-prestamos-web
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: sistema-prestamos-db
    databaseName: prestamos
    user: prestamos
